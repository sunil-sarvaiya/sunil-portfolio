<div class="header-main" [class.header-light]="themeMode" [class.scrolled]="isScrolled">
  <nav>
    <a class="logo" (click)="navigate('/home')">
      <span class="logo-bracket">&lt;</span>
      <span class="logo-text">Sunil</span>
      <span class="logo-bracket">/&gt;</span>
    </a>

    <ul class="nav-links" [class.open]="menuOpen">
      <li><a (click)="navigate('/home')" [class.active]="currentRoute === '/home'">Home</a></li>
      <li><a (click)="navigate('/about')" [class.active]="currentRoute === '/about'">About</a></li>
      <li><a (click)="navigate('/experience')" [class.active]="currentRoute === '/experience'">Experience</a></li>
      <li><a (click)="navigate('/projects')" [class.active]="currentRoute === '/projects'">Projects</a></li>
      <li><a (click)="navigate('/contact')" [class.active]="currentRoute === '/contact'">Contact</a></li>
    </ul>

    <div class="nav-overlay" [class.open]="menuOpen" (click)="closeMenu()"></div>

    <button class="nav-toggle" [class.open]="menuOpen" (click)="toggleMenu()" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
</div>
