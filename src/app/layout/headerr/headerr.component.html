<div [ngClass]="themeMode ? 'header-main' : ''">

    <a class="logo" routerLink="/home">
      <span class="logo-bracket">&lt;</span>
      <span class="logo-text">Sunil</span>
      <span class="logo-bracket">/&gt;</span>
    </a>

    <ul class="links" [class.open]="menuOpen">
      <li><a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="projects" routerLinkActive="active" (click)="closeMenu()">Projects</a></li>
      <li><a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a></li>
      <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a></li>
      <li><a routerLink="/experience" routerLinkActive="active" (click)="closeMenu()">Experience</a></li>
    </ul>

    <div class="icon-burger" [class.open]="menuOpen" (click)="toggleMenu()">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
  </nav>
</div>
