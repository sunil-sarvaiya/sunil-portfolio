<div class="experience-section" [ngClass]="themeMode ? 'light-bg' : ''">
  <div class="container">
    <div class="section-title" [ngClass]="themeMode ? 'light-font-color' : ''">
      <h2>Experience</h2>
      <p>My Experience</p>
    </div>

    <div class="timeline">
      <div class="timeline-item" *ngFor="let exp of experiences; let i = index; let last = last"
        [ngClass]="themeMode ? 'timeline-item-light' : ''">
        <div class="timeline-dot"></div>
        <div class="timeline-card">
          <div class="timeline-header">
            <div class="timeline-icon">
              <i [class]="exp.icon"></i>
            </div>
            <div>
              <h4>{{ exp.company }}</h4>
              <span class="timeline-date">{{ exp.date }}</span>
            </div>
          </div>
          <p>{{ exp.description }}</p>
          <div class="tech-tags">
            <span *ngFor="let tag of exp.tags" class="tag">{{ tag }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
