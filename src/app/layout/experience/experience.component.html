<div class="experience-section">
  <div class="container">
    <div class="section-title" appScrollReveal>
      <span class="section-number">02</span>
      <h2>Experience</h2>
      <p>My Experience</p>
    </div>

    <div class="timeline">
      <div class="timeline-item" *ngFor="let exp of experiences; let i = index; let last = last">
        <div class="timeline-dot"></div>
        <div class="timeline-card">
          <div class="timeline-header">
            <div class="timeline-icon">
              <i [class]="exp.icon"></i>
            </div>
            <div>
              <h4>{{ exp.company }}</h4>
              <span class="timeline-role">{{ exp.role }}</span>
              <span class="timeline-date">{{ exp.date }}</span>
            </div>
          </div>
          <p>{{ exp.description }}</p>
          <div class="tech-tags">
            <span *ngFor="let tag of exp.tags" class="tag">{{ tag }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
