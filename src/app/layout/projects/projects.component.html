<div id="projects" class="projects">
  <div class="container">
    <div class="section-title" appScrollReveal>
      <span class="section-number">03</span>
      <h2>Projects</h2>
      <p>My Professional and Personal Projects</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6 col-sm-12" *ngFor="let project of projects">
        <div class="project-card">
          <div class="card-icon">
            <i [class]="project.icon"></i>
          </div>
          <h4>{{ project.title }}</h4>
          <p>{{ project.description }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
