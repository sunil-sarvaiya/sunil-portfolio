<div id="projects" class="projects" [ngClass]="themeMode ? 'main-section-light' : ''">
  <div class="container">
    <div class="section-title" [ngClass]="themeMode ? 'light-font-color' : ''">
      <h2>Projects</h2>
      <p>My Professional and Personal Projects</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6 col-sm-12" *ngFor="let project of projects">
        <div class="project-card" [ngClass]="themeMode ? 'project-card-light' : ''">
          <div class="card-icon">
            <i [class]="project.icon"></i>
          </div>
          <h4>{{ project.title }}</h4>
          <p>{{ project.description }}</p>
          <ul>
            <li *ngFor="let tech of project.tech">{{ tech }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
